# Memory service (optional). Production refuses hash embedder, scripted LLM, static tokens,
# in-memory adapters, and ALLOW_IN_MEMORY_ADAPTERS=true. This stack does not set those.
# Do not `docker stack deploy` from an agent. No live provider calls are made by this file
# itself; the process will not start until the operator supplies a real embedder and LLM.
#
# pgvector image is not digest-pinned in proba-memory main.
version: "3.8"

x-memory-env: &memory-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://proba:${MEMORY_POSTGRES_PASSWORD:?set MEMORY_POSTGRES_PASSWORD}@memory-postgres:5432/proba_memory
  REDIS_URL: redis://${REDIS_USER:-proba}:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  EVENT_BUS: redis-streams
  EMBEDDING_DIMENSION: ${MEMORY_EMBEDDING_DIMENSION:-1024}
  EMBEDDER: ${MEMORY_EMBEDDER:?set MEMORY_EMBEDDER}
  EMBEDDER_BASE_URL: ${MEMORY_EMBEDDER_BASE_URL:?set MEMORY_EMBEDDER_BASE_URL}
  EMBEDDER_MODEL: ${MEMORY_EMBEDDER_MODEL:?set MEMORY_EMBEDDER_MODEL}
  EMBEDDER_API_KEY: ${MEMORY_EMBEDDER_API_KEY:?set MEMORY_EMBEDDER_API_KEY}
  LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:?set MEMORY_LLM_PROVIDER}
  LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:?set MEMORY_LLM_BASE_URL}
  LLM_MODEL: ${MEMORY_LLM_MODEL:?set MEMORY_LLM_MODEL}
  LLM_API_KEY: ${MEMORY_LLM_API_KEY:?set MEMORY_LLM_API_KEY}
  SOURCES: audit
  AUDIT_WORKSPACE_ID: ${AUDIT_WORKSPACE_ID:-seedbed}

services:
  memory-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: proba
      POSTGRES_PASSWORD_FILE: /run/secrets/memory_postgres_password
      POSTGRES_DB: proba_memory
    volumes:
      - memory_postgres_data:/var/lib/postgresql/data
    networks:
      - proba-network
    secrets:
      - memory_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proba -d proba_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    deploy:
      replicas: 1
      endpoint_mode: vip
      placement:
        constraints:
          - node.role == manager
      labels:
        proba.backup.role: postgres
        proba.component: memory-postgres
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  memory-migrate:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-memory-migrate:${VERSION:-latest}
    environment:
      <<: *memory-env
    networks:
      - proba-network
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  memory-api:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-memory-api:${VERSION:-latest}
    environment:
      <<: *memory-env
      PORT: "3200"
      MEMORY_API_TOKEN_VERIFIER: firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      MEMORY_API_ADMIN_EMAILS: ${MEMORY_API_ADMIN_EMAILS:?set MEMORY_API_ADMIN_EMAILS}
      MEMORY_API_ALLOWED_EMAILS: ${MEMORY_API_ALLOWED_EMAILS:-}
      MEMORY_API_ALLOWED_EMAIL_DOMAINS: ${MEMORY_API_ALLOWED_EMAIL_DOMAINS:-}
      MEMORY_API_WORKSPACE_ID: ${MEMORY_API_WORKSPACE_ID:-seedbed}
      MEMORY_API_CORS_ORIGINS: ${PUBLIC_PORTAL_ORIGIN:-}
      MEMORY_API_RATE_LIMITER: redis
      MEMORY_API_CONTEXT_READER_ENABLED: "true"
      CONTEXT_SERVICE_PUBLIC_KEY_FILE: /run/secrets/context_service_public_jwks
      HUB_ASSERTION_PUBLIC_KEY_FILE: /run/secrets/hub_assertion_public_jwks
    networks:
      - proba-network
    secrets:
      - context_service_public_jwks
      - hub_assertion_public_jwks
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT||3200)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: vip
      labels:
        proba.component: memory-api
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  memory-ingestor:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-memory-ingestor:${VERSION:-latest}
    environment:
      <<: *memory-env
      PORT: "3201"
    networks:
      - proba-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT||3201)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: vip
      labels:
        proba.component: memory-ingestor
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  memory-jobs:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-memory-jobs:${VERSION:-latest}
    environment:
      <<: *memory-env
      PORT: "3202"
      JOBS_ENABLED: ${MEMORY_JOBS_ENABLED:-decay}
    networks:
      - proba-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT||3202)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: vip
      labels:
        proba.component: memory-jobs
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  proba-network:
    name: proba-network
    external: true

volumes:
  memory_postgres_data:

secrets:
  memory_postgres_password:
    external: true
  context_service_public_jwks:
    external: true
  hub_assertion_public_jwks:
    external: true
